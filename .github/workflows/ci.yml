name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # cargo-pgrx must match the pgrx version in Cargo.toml.
  PGRX_VERSION: 0.19.1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-pgrx${{ env.PGRX_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pgrx${{ env.PGRX_VERSION }}-

    - name: Cache pgrx PostgreSQL builds
      uses: actions/cache@v4
      with:
        path: ~/.pgrx
        key: ${{ runner.os }}-pgrx-pg${{ matrix.pg }}-${{ env.PGRX_VERSION }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libreadline-dev \
          pkg-config \
          build-essential \
          libssl-dev \
          zlib1g-dev \
          protobuf-compiler \
          libicu-dev \
          bison \
          flex \
          postgresql-client

    - name: Install DuckDB for TPC-H data generation
      run: |
        wget -q https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
        unzip duckdb_cli-linux-amd64.zip
        sudo mv duckdb /usr/local/bin/
        chmod +x /usr/local/bin/duckdb

    - name: Install cargo-pgrx
      run: |
        # The cache can restore an older binary; verify the version.
        if ! cargo pgrx --version 2>/dev/null | grep -q "$PGRX_VERSION"; then
          cargo install --locked --force cargo-pgrx --version "=$PGRX_VERSION"
        else
          echo "cargo-pgrx $PGRX_VERSION already installed"
        fi

    - name: Initialize pgrx
      run: |
        if [ ! -e ~/.pgrx/config.toml ]; then
          cargo pgrx init --pg${{ matrix.pg }} download
        else
          echo "pgrx already initialized from cache"
        fi

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all --no-default-features --features pg${{ matrix.pg }} -- -D warnings

    - name: Run tests
      run: cargo pgrx test pg${{ matrix.pg }} --no-default-features

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: pre-commit/action@v3.0.1
